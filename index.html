<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7C6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CanSMS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>CanSMS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E7C6B'/%3E%3Cpath d='M14 18h36a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H30l-10 9v-9h-6a4 4 0 0 1-4-4V22a4 4 0 0 1 4-4z' fill='white'/%3E%3C/svg%3E">
<style>
  /* Yerleşim: tek sütun; üstte başlık, ortada mesaj listesi, altta yazma alanı */
  :root {
    --bg: #EDF1F0;
    --surface: #FFFFFF;
    --fg: #14201E;
    --muted: #5B6C68;
    --line: #D5DDDB;
    --accent: #0E7C6B;
    --on-accent: #FFFFFF;
    --mine: #0E7C6B;
    --on-mine: #FFFFFF;
    --theirs: #FFFFFF;
    --danger: #B3261E;
    --shadow: 0 1px 2px rgba(20, 32, 30, .08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D1413;
      --surface: #16201F;
      --fg: #E6EFED;
      --muted: #8DA39F;
      --line: #263634;
      --accent: #2FB59D;
      --on-accent: #06201B;
      --mine: #11695B;
      --on-mine: #FFFFFF;
      --theirs: #1C2A28;
      --danger: #FF8A80;
      --shadow: none;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .screen { height: 100%; display: flex; flex-direction: column; }

  /* Giriş ekranı */
  #setup {
    align-items: center;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    overflow-y: auto;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px 20px;
    box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .brand svg { width: 44px; height: 44px; flex: none; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -.01em; }
  .lead { color: var(--muted); margin: 6px 0 20px; font-size: .95rem; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 14px 0 6px; }
  .field { display: flex; gap: 8px; }
  input[type=text], input[type=password], textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 16px;
    outline: none;
  }
  input:focus-visible, textarea:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .ghost {
    flex: none;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0 14px;
    color: var(--muted);
  }
  .primary {
    width: 100%;
    margin-top: 20px;
    background: var(--accent);
    color: var(--on-accent);
    border: 0;
    border-radius: 12px;
    padding: 14px;
    font-weight: 700;
  }
  .primary:disabled { opacity: .6; cursor: default; }
  button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
  .error { color: var(--danger); font-size: .9rem; margin: 12px 0 0; min-height: 1.2em; }
  .fine { color: var(--muted); font-size: .8rem; margin: 16px 0 0; }

  /* Sohbet ekranı */
  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    padding-bottom: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header .title { flex: 1; min-width: 0; }
  header strong { display: block; font-size: 1.05rem; }
  header small { color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: #2EA043; }
  .dot.wait { background: #D29922; }
  .link { background: none; border: 0; color: var(--muted); padding: 8px; font-size: .9rem; }

  #list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-top: 12px;
    padding-bottom: 12px;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 6px;
    -webkit-overflow-scrolling: touch;
  }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 280px; font-size: .95rem; }
  .row { display: flex; }
  .row.mine { justify-content: flex-end; }
  .bubble {
    max-width: min(82%, 520px);
    min-width: 0;
    padding: 8px 12px 6px;
    border-radius: 16px;
    background: var(--theirs);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    overflow-wrap: anywhere;
  }
  .mine .bubble { background: var(--mine); color: var(--on-mine); border-color: transparent; border-bottom-right-radius: 5px; }
  .theirs .bubble { border-bottom-left-radius: 5px; }
  .who { font-size: .75rem; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
  .text { white-space: pre-wrap; }
  .bubble img { display: block; max-width: 100%; max-height: 340px; border-radius: 10px; margin: 2px 0; cursor: zoom-in; }
  .meta { font-size: .7rem; opacity: .75; text-align: right; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .pending { opacity: .65; }

  .composer {
    flex: none;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding-top: 8px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    padding-left: max(10px, env(safe-area-inset-left, 0px));
    padding-right: max(10px, env(safe-area-inset-right, 0px));
  }
  .composer textarea { resize: none; max-height: 140px; border-radius: 20px; padding: 10px 14px; line-height: 1.35; }
  .round {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--muted);
  }
  .round svg { width: 22px; height: 22px; }
  .round.send { background: var(--accent); color: var(--on-accent); }
  .round:disabled { opacity: .5; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: var(--fg);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: .9rem;
    max-width: calc(100% - 32px);
    z-index: 30;
  }
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .92);
    display: grid;
    place-items: center;
    z-index: 40;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  @media (prefers-reduced-motion: no-preference) {
    .row { animation: pop .15s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>

<main id="setup" class="screen">
  <form class="card" id="setupForm" autocomplete="off">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0E7C6B"/><path d="M14 18h36a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H30l-10 9v-9h-6a4 4 0 0 1-4-4V22a4 4 0 0 1 4-4z" fill="#fff"/></svg>
      <h1>CanSMS</h1>
    </div>
    <p class="lead">İki kişilik özel sohbet. İkiniz de aynı sohbet şifresini yazın.</p>

    <label for="name">Adın</label>
    <input type="text" id="name" maxlength="20" placeholder="Örneğin Can" autocapitalize="words" required>

    <label for="pass">Sohbet şifresi</label>
    <div class="field">
      <input type="password" id="pass" minlength="8" placeholder="En az 8 karakter" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button type="button" class="ghost" id="showPass">Göster</button>
    </div>

    <p class="error" id="setupError" role="alert"></p>
    <button class="primary" id="go" type="submit">Sohbete gir</button>
    <p class="fine">Mesajlar ve fotoğraflar telefonda şifrelenir. Sunucuda yalnızca şifreli veri durur, şifreyi bilmeyen okuyamaz. Şifreyi unutursanız mesajlar kurtarılamaz.</p>
  </form>
</main>

<main id="chat" class="screen" hidden>
  <header>
    <div class="title">
      <strong>CanSMS</strong>
      <small><span class="dot wait" id="dot"></span><span id="status">Bağlanıyor…</span></small>
    </div>
    <button class="link" id="leave" type="button">Çıkış</button>
  </header>

  <div id="list" aria-live="polite">
    <p class="empty" id="empty">Henüz mesaj yok. İlk mesajı yaz.</p>
  </div>

  <form class="composer" id="composer">
    <input type="file" id="file" accept="image/*" hidden>
    <button type="button" class="round" id="photo" aria-label="Fotoğraf gönder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
    <textarea id="msg" rows="1" maxlength="4000" placeholder="Mesaj yaz" aria-label="Mesaj"></textarea>
    <button type="submit" class="round send" id="send" aria-label="Gönder">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6l-.1 6.5L15 12 3.3 13.9z"/></svg>
    </button>
  </form>
</main>

<div id="toast" role="status" hidden></div>
<div id="lightbox" hidden><img alt="Fotoğraf"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_wl1jjtMKiWEWh6BuAGF0YzW6n52e470",
  authDomain: "cansms-b0f52.firebaseapp.com",
  projectId: "cansms-b0f52",
  storageBucket: "cansms-b0f52.firebasestorage.app",
  messagingSenderId: "292363493297",
  appId: "1:292363493297:web:cc37747c72a6afca2b6790"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* yok say */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* yok say */ } }
};

/* ---------- Şifreleme ---------- */
const enc = new TextEncoder();
const dec = new TextDecoder();
const hex = (u8) => Array.from(u8, (b) => b.toString(16).padStart(2, "0")).join("");

function toB64(buf) {
  const a = new Uint8Array(buf);
  let s = "";
  for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000));
  return btoa(s);
}
function fromB64(str) {
  const s = atob(str);
  const a = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}

// Şifreden iki ayrı değer türetilir: mesajları kilitleyen anahtar ve oda adı.
async function deriveKeys(pass) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: enc.encode("cansms-v1"), iterations: 200000, hash: "SHA-256" }, base, 512));
  const aes = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-GCM", false, ["encrypt", "decrypt"]);
  return { aes, roomId: hex(bits.slice(32, 64)) };
}
async function encrypt(aes, text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aes, enc.encode(text));
  return { iv: toB64(iv), ct: toB64(ct) };
}
async function decrypt(aes, iv, ct) {
  const out = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(iv) }, aes, fromB64(ct));
  return dec.decode(out);
}

/* ---------- Durum ---------- */
let keys = null;
let myName = "";
let unsub = null;
let queue = Promise.resolve();
let firstSnapshot = true;
let unread = 0;
let stick = true;
const entries = new Map(); // id -> { id, ts, p, pending, el }

let clientId = store.get("cid");
if (!clientId) {
  clientId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
  store.set("cid", clientId);
}

/* ---------- Küçük yardımcılar ---------- */
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 3500);
}
function setStatus(kind, text) {
  $("dot").className = "dot " + kind;
  $("status").textContent = text;
}
function fmtTime(ms) {
  const d = new Date(ms);
  const now = new Date();
  const hm = d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return hm;
  return d.toLocaleDateString("tr-TR", { day: "numeric", month: "short" }) + " " + hm;
}
function errText(e) {
  const c = e && e.code ? String(e.code) : "";
  if (c === "auth/operation-not-allowed") return "Firebase'de Anonymous giriş kapalı. Authentication > Sign-in method bölümünden aç.";
  if (c === "auth/network-request-failed") return "İnternet bağlantısı yok.";
  if (c.includes("permission-denied")) return "Firestore kuralları yayınlanmamış. Kuralları yapıştırıp Publish de.";
  return (e && e.message) ? e.message : "Bilinmeyen hata";
}

/* ---------- Giriş ---------- */
$("showPass").addEventListener("click", () => {
  const p = $("pass");
  const show = p.type === "password";
  p.type = show ? "text" : "password";
  $("showPass").textContent = show ? "Gizle" : "Göster";
});

$("setupForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  enter($("name").value.trim(), $("pass").value);
});

async function enter(name, pass) {
  const err = $("setupError");
  err.textContent = "";
  if (!name) { err.textContent = "Adını yaz."; return; }
  if (pass.length < 8) { err.textContent = "Şifre en az 8 karakter olmalı."; return; }
  if (!window.crypto || !crypto.subtle) { err.textContent = "Bu sayfa https adresinden açılmalı."; return; }
  $("go").disabled = true;
  $("go").textContent = "Giriliyor…";
  try {
    keys = await deriveKeys(pass);
    await signInAnonymously(auth);
    myName = name;
    store.set("name", name);
    store.set("pass", pass);
    openChat();
  } catch (e) {
    err.textContent = errText(e);
    $("go").disabled = false;
    $("go").textContent = "Sohbete gir";
  }
}

/* ---------- Sohbet ---------- */
function openChat() {
  $("setup").hidden = true;
  $("chat").hidden = false;
  setStatus("wait", "Bağlanıyor…");
  const q = query(collection(db, "rooms", keys.roomId, "messages"), orderBy("ts", "desc"), limit(150));
  unsub = onSnapshot(q, { includeMetadataChanges: true },
    (snap) => { queue = queue.then(() => handleSnapshot(snap)).catch(() => {}); },
    (e) => { setStatus("wait", "Hata"); toast(errText(e)); });
  $("msg").focus();
}

async function handleSnapshot(snap) {
  setStatus(snap.metadata.fromCache ? "wait" : "ok",
    (snap.metadata.fromCache ? "Bağlanıyor… " : "Bağlı · ") + "oda " + keys.roomId.slice(0, 4).toUpperCase());
  for (const d of snap.docs) {
    const data = d.data({ serverTimestamps: "estimate" });
    let en = entries.get(d.id);
    if (!en) {
      let p = null;
      try { p = JSON.parse(await decrypt(keys.aes, data.iv, data.ct)); } catch { p = null; }
      en = { id: d.id, p, el: null, ts: 0, pending: false };
      entries.set(d.id, en);
      if (p && !firstSnapshot && p.c !== clientId && document.hidden) {
        unread++;
        document.title = "(" + unread + ") CanSMS";
      }
    }
    en.ts = data.ts && data.ts.toMillis ? data.ts.toMillis() : Date.now();
    en.pending = d.metadata.hasPendingWrites;
  }
  firstSnapshot = false;
  reflow();
}

function buildEl(en) {
  const mine = en.p.c === clientId;
  const row = document.createElement("div");
  row.className = "row " + (mine ? "mine" : "theirs");
  const b = document.createElement("div");
  b.className = "bubble";
  if (!mine) {
    const w = document.createElement("div");
    w.className = "who";
    w.textContent = en.p.n || "?";
    b.appendChild(w);
  }
  if (en.p.t === "i") {
    const img = document.createElement("img");
    img.alt = "Fotoğraf";
    img.src = en.p.b;
    img.addEventListener("load", () => { if (stick) scrollDown(); });
    img.addEventListener("click", () => { $("lightbox").querySelector("img").src = en.p.b; $("lightbox").hidden = false; });
    b.appendChild(img);
  } else {
    const t = document.createElement("div");
    t.className = "text";
    t.textContent = en.p.b;
    b.appendChild(t);
  }
  const m = document.createElement("div");
  m.className = "meta";
  b.appendChild(m);
  row.appendChild(b);
  row._meta = m;
  row._bubble = b;
  return row;
}

function reflow() {
  const list = $("list");
  const items = [...entries.values()].filter((e) => e.p).sort((a, b) => (a.ts - b.ts) || (a.id < b.id ? -1 : 1));
  $("empty").hidden = items.length > 0;
  items.forEach((en, i) => {
    if (!en.el) en.el = buildEl(en);
    en.el._meta.textContent = fmtTime(en.ts) + (en.el.classList.contains("mine") ? (en.pending ? " ·" : " ✓") : "");
    en.el._bubble.classList.toggle("pending", en.pending);
    const at = list.querySelectorAll(".row")[i];
    if (at !== en.el) list.insertBefore(en.el, at || null);
  });
  if (stick) scrollDown();
}

function scrollDown() {
  const l = $("list");
  l.scrollTop = l.scrollHeight;
}
$("list").addEventListener("scroll", () => {
  const l = $("list");
  stick = l.scrollHeight - l.scrollTop - l.clientHeight < 120;
});

/* ---------- Gönderme ---------- */
async function sendPayload(p) {
  const body = await encrypt(keys.aes, JSON.stringify(p));
  await addDoc(collection(db, "rooms", keys.roomId, "messages"), { iv: body.iv, ct: body.ct, ts: serverTimestamp() });
}
function pushMessage(p) {
  stick = true;
  sendPayload(p).catch((e) => toast("Gönderilemedi: " + errText(e)));
}

$("composer").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const text = $("msg").value.trim();
  if (!text) return;
  $("msg").value = "";
  autoGrow();
  pushMessage({ t: "t", n: myName, c: clientId, b: text, d: Date.now() });
  $("msg").focus();
});

function autoGrow() {
  const t = $("msg");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 140) + "px";
}
$("msg").addEventListener("input", autoGrow);
$("msg").addEventListener("keydown", (ev) => {
  // Bilgisayarda Enter gönderir, Shift+Enter yeni satır açar. Telefonda Enter yeni satırdır.
  if (ev.key === "Enter" && !ev.shiftKey && window.matchMedia("(pointer: fine)").matches) {
    ev.preventDefault();
    $("composer").requestSubmit();
  }
});

/* ---------- Fotoğraf ---------- */
function loadImage(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file);
    const i = new Image();
    i.onload = () => { URL.revokeObjectURL(u); res(i); };
    i.onerror = () => { URL.revokeObjectURL(u); rej(new Error("Fotoğraf okunamadı")); };
    i.src = u;
  });
}
async function compress(file) {
  const img = await loadImage(file);
  const tries = [[1024, 0.72], [800, 0.6], [640, 0.5], [480, 0.4]];
  for (const [max, q] of tries) {
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * sc));
    c.height = Math.max(1, Math.round(img.naturalHeight * sc));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL("image/jpeg", q);
    if (url.length <= 600000) return url;
  }
  throw new Error("Fotoğraf çok büyük");
}
$("photo").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async () => {
  const f = $("file").files[0];
  $("file").value = "";
  if (!f) return;
  $("photo").disabled = true;
  toast("Fotoğraf hazırlanıyor…");
  try {
    const url = await compress(f);
    pushMessage({ t: "i", n: myName, c: clientId, b: url, d: Date.now() });
    $("toast").hidden = true;
  } catch (e) {
    toast(e.message || "Fotoğraf gönderilemedi");
  }
  $("photo").disabled = false;
});

/* Ana ekrana eklenince uygulama gibi görünsün diye simge ve manifest üretilir. */
function makeIcon(size) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const s = size / 64;
  g.fillStyle = "#0E7C6B";
  g.fillRect(0, 0, size, size);
  g.fillStyle = "#fff";
  g.scale(s, s);
  g.fill(new Path2D("M14 18h36a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H30l-10 9v-9h-6a4 4 0 0 1-4-4V22a4 4 0 0 1 4-4z"));
  return c.toDataURL("image/png");
}
try {
  const touch = document.createElement("link");
  touch.rel = "apple-touch-icon";
  touch.href = makeIcon(180);
  document.head.appendChild(touch);
  const manifest = {
    name: "CanSMS", short_name: "CanSMS", display: "standalone",
    start_url: location.href.split("#")[0], background_color: "#EDF1F0", theme_color: "#0E7C6B",
    icons: [{ src: makeIcon(192), sizes: "192x192", type: "image/png" }, { src: makeIcon(512), sizes: "512x512", type: "image/png" }]
  };
  const ml = document.createElement("link");
  ml.rel = "manifest";
  ml.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
  document.head.appendChild(ml);
} catch { /* simge zorunlu değil */ }
